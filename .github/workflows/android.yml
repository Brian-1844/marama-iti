# Construit automatiquement l'application Android (.apk) à chaque modification,
# la signe avec la clé fixe de Marama Iti, puis la publie dans "Releases".
#
# Clé de signature : à ranger dans Settings → Secrets and variables → Actions :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# Sans ces secrets, l'APK est construit avec une clé de test (mises à jour impossibles).
#
# Option : publier l'APK dans un autre dépôt public (si celui-ci devient privé) :
#   variable DOWNLOAD_REPO (ex. Brian-1844/marama-iti-telechargement)
#   + secret DOWNLOAD_REPO_TOKEN (jeton GitHub avec le droit "Contents: write" sur ce dépôt)
name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Construire et signer l'APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS \
              --out ../marama-iti.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs ../marama-iti.apk | head -3
            rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"
          else
            echo "::warning::Clé de signature absente : APK de test. Ajoutez les secrets ANDROID_KEYSTORE_* pour permettre les mises à jour."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../marama-iti.apk
          fi

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.DOWNLOAD_REPO || github.repository }}
          token: ${{ secrets.DOWNLOAD_REPO_TOKEN || github.token }}
          tag_name: v1.${{ github.run_number }}
          name: Marama Iti 1.${{ github.run_number }}
          target_commitish: ${{ vars.DOWNLOAD_REPO && 'main' || github.sha }}
          files: marama-iti.apk
          make_latest: true
